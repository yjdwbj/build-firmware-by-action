          echo "name=status::success" >>$GITHUB_OUTPUT

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "x86_64-kernel-amd-latest"
          prerelease: true
          title: "Development build of x86_64 AuthenticAMD kernel debian package"
          files: |
            Release.txt
            ${{ github.workspace }}/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{env.CPU_NAME}} ${{ env.LOCALVERSION }}
          path: |
            ${{ github.workspace }}/*.deb
          retention-days: 7

  publish:
    needs: [build_A8_7410_kernel, build_N100_kernel, build_amd_kernel]
    # Release it as soon as it compiles successfully on at least one platform.
    if: always() && (needs.build_A8_7410_kernel.result == 'success' || needs.build_N100_kernel.result == 'success' || needs.build_amd_kernel.result == 'success' )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA:   ${{ needs.check.outputs.sha }}
          TAG:   ${{ needs.check.outputs.tag }}
        run: |
          ls -lh ./
          tag=$(git ls-remote --tags $KERNEL_GIT | awk -F '/' '{print $3}' | grep '^v[0-9].[0-9]\{1,2\}.[0-9]\{1,2\}$' | sort -V | tail -n1)
          TAG=linux-kernel-lcy-$tag
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.deb -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" *.deb \
              -R "$GITHUB_REPOSITORY" \
              --title "Main stream linux kernel build $TAG" \
              --notes "Upstream: https://github.com/$UPSTREAM/commit/$SHA" \
              --latest
          fi

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("linux-kernel-lcy-"))) | sort_by(.createdAt) | reverse | .['"$KEEP_RELEASES"':][] | .tagName' \
          | while read -r tag; do
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done


