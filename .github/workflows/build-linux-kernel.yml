          mkdir -p ${KER_INSTALL_DIR}/boot

          [ -e $CONFIG_N100_FILE ] && mv $CONFIG_N100_FILE ${KER_BUILD_DIR}/.config
          cd ${KER_BUILD_DIR}

          make olddefconfig
          scripts/config -d SYSTEM_REVOCATION_KEYS
