name: Build OpenWrt Firwmare

on:
  # push:
  repository_dispatch:
  schedule:
    - cron: 1 20 * * *
  workflow_dispatch:
    inputs:
      force:
        description: 'Recompile even if there are no new commits upstream'
        type: boolean
        default: false
      ref:
        description: 'target branch'
        default: 'main'

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_GEHUA_FILE: openwrt_mt7621-gehua-ghl-r-001.config
  CONFIG_XIAOMI_FILE: openwrt_xiaomi-ax3000t-rd03.config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  WORK_DIR: /workdir
  UPSTREAM: openwrt/openwrt
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ref:     ${{ steps.up.outputs.ref }}
      changed: ${{ steps.up.outputs.changed }}
    steps:
      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          TAG=$(git ls-remote --tags $REPO_URL | awk -F '/' '{print $3}' | grep '^v[0-9][0-9].[0-9]\{1,2\}.[0-9]\{1,2\}$' | sort -V  | tail -n1)
          echo "get latest release version $TAG"
          [ -z "$TAG" ] && TAG="$REF"
          echo "ref=$TAG"     >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG  exist, skip"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

  build_gehua:
    needs: check
    name: Build GeHua firmware
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004) tree
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout upstream
      uses: actions/checkout@v6
      with:
        repository: ${{ env.UPSTREAM }}
        ref: ${{ needs.check.outputs.ref }}
        fetch-depth: 0

    - name: Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: cache
      if: github.event.inputs.cache == 'true' && github.event.inputs.cache != 'false'
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Update feeds
      run: |
        echo "here is my path: `ls /workdir`"
        ./scripts/feeds update -a

    - name: Install feeds
      run: ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files .
        [ -e $CONFIG_GEHUA_FILE ] && mv $CONFIG_GEHUA_FILE .config
        TODAY=$(date +%Y-%m-%d)
        sh -c "sed -i -e 's/CONFIG_VERSION_NUMBER=.*/CONFIG_VERSION_NUMBER=\"${TODAY}\"/' .config"

    - name: Generate configuration file
      run: make defconfig

    - name: Download package
      id: package
      run: |
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        echo -e "compile"
        make -j$(nproc) || make -j1 V=s
        echo "======================="
        echo "Space usage:"
        echo "======================="

        echo "name=status::success" >>$GITHUB_OUTPUT
        tdev=$(grep "CONFIG_TARGET_PROFILE" .config | awk -F= '{print $2}' | tr -d '"')
        DEVICE_NAME=${tdev##DEVICE_}
        FILE_DATE=_$(date +"%Y%m%d%H%M")
        GIT_REV=_$(git rev-parse --short HEAD)
        echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
        echo "FILE_DATE=${FILE_DATE}" >> $GITHUB_ENV
        echo "GIT_REV=${GIT_REV}" >> $GITHUB_ENV
        echo "RELEASE_NAME=OpenWrt_firmware_${DEVICE_NAME}${GIT_REV}${FILE_DATE}.tar.gz" >> $GITHUB_ENV

    - name: Check space usage
      run: |
        df -hT
        echo "tree directory ....."
        tree -L 2 -d

    - name: Prepare artifact
      run: |
        TEMP=$(date +"OpenWrt_${{ env.DEVICE_NAME }}_%Y%m%d_%H%M%S_")$(git rev-parse --short HEAD)
        echo "RELEASE_TAG=$TEMP" >> $GITHUB_ENV
        tar -cvzf ${{ github.workspace }}/${{env.RELEASE_NAME}}bin/targets/ramips/mt7621/* --owner=0 --group=0
        rm -rf $(find bin/targets/ -type d -name "packages")

    - name: Generate release tag
      id: tag
      run: |
        echo "name=release_tag::$(date +%Y.%m.%d-%H%M)" >>$GITHUB_OUTPUT
        echo "OpenWRT firmware ${{env.RELEASE_NAME}}" > Release.txt
        echo "name=status::success" >>$GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: "openwrt-latest"
        path: |
          ${{ github.workspace }}/*.tar.gz
          Release.txt

    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "openwrt-latest"
        prerelease: true
        title: "Development build of openwrt firmware package"
        files: |
          Release.txt
          ${{ github.workspace }}/${{env.RELEASE_NAME}}

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: OpenWrt-GeHua
        files: |
          Release.txt
          ${{ github.workspace }}/${{env.RELEASE_NAME}}

  build_xiaomi:
    needs: check
    name: Build XiaoMi AX3000T rd03 firmware
    runs-on: ubuntu-24.04
    steps:
    - name: Initialization environment
      env:
        REF: ${{ inputs.ref || 'main' }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004) tree
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout upstream
      uses: actions/checkout@v6
      with:
        repository: ${{ env.UPSTREAM }}
        ref: ${{ needs.check.outputs.ref }}
        fetch-depth: 0

    - name: Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: cache
      if: github.event.inputs.cache == 'true' && github.event.inputs.cache != 'false'
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Update feeds
      run: ./scripts/feeds update -a

    - name: Install feeds
      run: ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files files
        [ -e $CONFIG_XIAOMI_FILE ] && mv $CONFIG_XIAOMI_FILE .config
        TODAY=$(date +%Y-%m-%d)
        sh -c "sed -i -e 's/CONFIG_VERSION_NUMBER=.*/CONFIG_VERSION_NUMBER=\"${TODAY}\"/' .config"

    - name: Generate configuration file
      run: make defconfig

    - name: Download package
      id: package
      run: |
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "compile"
        make -j$(nproc) || make -j1 V=s
        echo "name=status::success" >>$GITHUB_OUTPUT
        tdev=$(grep "CONFIG_TARGET_PROFILE" .config | awk -F= '{print $2}' | tr -d '"')
        DEVICE_NAME=${tdev##DEVICE_}
        FILE_DATE=_$(date +"%Y%m%d%H%M")
        GIT_REV=_$(git rev-parse --short HEAD)
        echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
        echo "FILE_DATE=${FILE_DATE}" >> $GITHUB_ENV
        echo "GIT_REV=${GIT_REV}" >> $GITHUB_ENV
        echo "RELEASE_NAME=OpenWrt_firmware_${DEVICE_NAME}${GIT_REV}${FILE_DATE}.tar.gz" >> $GITHUB_ENV

    - name: Check space usage
      run: |
        df -hT
        echo "tree directory ....."
        tree -L 2 -d

    - name: Prepare artifact
      run: |
        TEMP=$(date +"OpenWrt_${{ env.DEVICE_NAME }}_%Y%m%d_%H%M%S_")$(git rev-parse --short HEAD)
        echo "RELEASE_TAG=$TEMP" >> $GITHUB_ENV
        tar -cvzf ${{ github.workspace }}/${{env.RELEASE_NAME}} bin/targets/mediatek/filogic/* --owner=0 --group=0
        rm -rf $(find bin/targets/ -type d -name "packages")

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_NAME }}
        path: ${{ github.workspace }}/*.tar.gz


    - name: Generate release tag
      id: tag
      run: |
        echo "name=release_tag::$(date +%Y.%m.%d-%H%M)" >>$GITHUB_OUTPUT
        echo "OpenWRT firmware ${{env.RELEASE_NAME}}" > Release.txt
        echo "name=status::success" >>$GITHUB_OUTPUT

    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "openwrt-latest"
        prerelease: true
        title: "Development build of openwrt firmware package"
        files: |
          Release.txt
          ${{ github.workspace }}/*.tar.gz

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: OpenWrt-XiaoMi-AX3000T-rd03
        files: |
          Release.txt
          ${{ github.workspace }}/${{env.RELEASE_NAME}}
