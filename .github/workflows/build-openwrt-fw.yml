name: Build OpenWrt Firwmare

on:
  # push:
  repository_dispatch:
  schedule:
    - cron: 1 20 * * *
  workflow_dispatch:
    inputs:
      force:
        description: 'Recompile even if there are no new commits upstream'
        type: boolean
        default: false
      ref:
        description: 'target branch'
        default: 'main'

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CHINA_LIST_URL: https://cdn.jsdelivr.net/gh/felixonmars/dnsmasq-china-list@master/accelerated-domains.china.conf
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  WORK_DIR: /mnt/work
  UPSTREAM: openwrt/openwrt
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ref:     ${{ steps.up.outputs.ref }}
      sha:     ${{ steps.up.outputs.sha }}
      tag:     ${{ steps.up.outputs.tag }}
      date:    ${{ steps.up.outputs.date }}
      changed: ${{ steps.up.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if [ -z "$REF" ] || [ "$REF" == "main" ]; then
            REF=$(git ls-remote --tags $REPO_URL | awk -F '/' '{print $3}' | grep '^v[0-9][0-9].[0-9]\{1,2\}.[0-9]\{1,2\}$' | sort -V  | tail -n1)
          fi

          SHA=$(git ls-remote --tags --refs "$REPO_URL"  "refs/tags/${REF}" | awk '{print $1}')
          echo "get latest release version $REF and sha $SHA"

          CFG=$(git rev-parse HEAD:files | sha256sum | cut -c1-7)
          TAG="openwrt-${REF}-${CFG}"

          echo "sha=$SHA"             >> "$GITHUB_OUTPUT"
          echo "ref=$REF"             >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" != "true" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG  exist, skip"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

  build_gehua:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: Build GeHua firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: gehua-ghl-r-001
      CONFIG: openwrt_mt7621-gehua-ghl-r-001.config
      TARGET: ramips/mt7621
      CHECKS: >-
        TARGET_ramips_mt7621_DEVICE_gehua_ghl-r-001
        PACKAGE_wpad-mbedtls PACKAGE_luci-ssl PACKAGE_smartdns
        PACKAGE_adblock PACKAGE_luci-app-adblock PACKAGE_gawk
        PACKAGE_kmod-mt7603 PACKAGE_kmod-mt76x2
        PACKAGE_kmod-usb-storage PACKAGE_block-mount
      REF: ${{ needs.check.outputs.ref }}
      DATE: ${{ needs.check.outputs.date }}
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
    - name: Prepare work dir
      run: |
        sudo mkdir -p "$WORK_DIR" && sudo chown "$(id -u):$(id -g)" "$WORK_DIR"
        df -h / /mnt

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache

    - name: Checkout upstream
      uses: actions/checkout@v6
      with:
        path: repo

    - name: Clone OpenWrt
      run: git clone --depth 1 --branch "$REF" "$REPO_URL" "$WORK_DIR/openwrt"

    - name: dl cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/openwrt/dl
        key: dl-${{ env.DEVICE }}-${{ env.REF }}-${{ github.run_id }}
        restore-keys: dl-${{ env.DEVICE }}-${{ env.REF }}-

    - name: ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/openwrt/.ccache
        key: ccache-${{ env.DEVICE }}-${{ env.REF }}-${{ github.run_id }}
        restore-keys: ccache-${{ env.DEVICE }}-${{ env.REF }}-

    - name: Feeds
      working-directory: ${{ env.WORK_DIR }}/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Root overlay
      env:
          FILES_PRIVATE_TGZ: ${{ secrets.FILES_PRIVATE_TGZ }}
      run: |
          F="$WORK_DIR/openwrt/files"
          mkdir -p "$F" && cp -a repo/files/. "$F"/
          [ -n "$FILES_PRIVATE_TGZ" ] && echo "$FILES_PRIVATE_TGZ" | base64 -d | tar -xz -C "$F"

          LIST="$F/etc/smartdns/domain-set/china-list.txt"
          mkdir -p "$(dirname "$LIST")"
          curl -fsSL --retry 3 "$CHINA_LIST_URL" | sed -n 's|^server=/\(.*\)/.*$|\1|p' > /tmp/cl.txt || true
          if [ "$(wc -l < /tmp/cl.txt)" -gt 10000 ]; then mv /tmp/cl.txt "$LIST"
          else echo "::warning::china-list download failed, keep repo copy"; fi
          [ -s "$LIST" ] || { echo "::error::china-list.txt missing"; exit 1; }

          grep -q localhost "$F/etc/myhosts" 2>/dev/null || \
            printf '127.0.0.1 localhost\n::1 localhost\n' >> "$F/etc/myhosts"
          chmod 755 "$F"/etc/uci-defaults/* 2>/dev/null || true
          find "$F" -type f | sort

    - name: .config
      working-directory: ${{ env.WORK_DIR }}/openwrt
      run: |
          cp "$GITHUB_WORKSPACE/repo/$CONFIG" .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          fail=0
          for o in $CHECKS; do
            grep -q "^CONFIG_${o}=y" .config && echo "OK  $o" || { echo "::error::missing CONFIG_${o}=y"; fail=1; }
          done
          for p in cloudflared sing-box tailscale perl; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config && { echo "::error::$p must not be built in"; fail=1; }
          done
          exit $fail

    - name: Download
      working-directory: ${{ env.WORK_DIR }}/openwrt
      run: |
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: Build
      working-directory: ${{ env.WORK_DIR }}/openwrt
      run: make -j"$(nproc)" || make -j1 V=s

    - name: Package
      run: |
          NAME="openwrt-${REF}-${DEVICE}-${DATE}"
          OUT="$WORK_DIR/out/$NAME"; mkdir -p "$OUT"
          find "$WORK_DIR/openwrt/bin/targets/$TARGET" -maxdepth 1 -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*initramfs*' \
               -o -name '*.manifest' -o -name 'sha256sums' \) -exec cp {} "$OUT"/ \;
          cp "$WORK_DIR/openwrt/.config" "$OUT/$DEVICE.config"
          (cd "$WORK_DIR/openwrt" && ./scripts/diffconfig.sh) > "$OUT/$DEVICE.diffconfig"
          if grep -iqE '^(perl|python3|cloudflared|sing-box) ' "$OUT"/*.manifest; then
            echo "::error::unexpected package in manifest"; exit 1
          fi
          mkdir -p dist
          tar -czf "dist/$NAME.tar.gz" -C "$WORK_DIR/out" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist "$OUT"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE }}
        path: dist/*
        retention-days: 7


  build_xiaomi:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: Build XiaoMi AX3000T rd03 firmware
    timeout-minutes: 360
    env:
      CONFIG: openwrt_xiaomi-ax3000t-rd03.config
      TARGET: mediatek/filogic
      DEVICE: ax3000t
