            unzip zlib1g-dev file wget curl ccache

    - name: Checkout upstream
      uses: actions/checkout@v6
      with:
        path: repo

    - name: Clone OpenWrt
      run: git clone --depth 1 --branch "$REF" "$REPO_URL" "$WORK_DIR/openwrt"

    - name: dl cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/openwrt/dl
        key: dl-${{ env.DEVICE }}-${{ env.REF }}-${{ github.run_id }}
        restore-keys: dl-${{ env.DEVICE }}-${{ env.REF }}-

    - name: ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/openwrt/.ccache
        key: ccache-${{ env.DEVICE }}-${{ env.REF }}-${{ github.run_id }}
        restore-keys: ccache-${{ env.DEVICE }}-${{ env.REF }}-

    - name: Feeds
      working-directory: ${{ env.WORK_DIR }}/openwrt
